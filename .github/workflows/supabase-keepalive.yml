name: Supabase keep-alive

on:
  schedule:
    # Four lightweight database requests per day (UTC).
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: true

jobs:
  ping-database:
    name: Register database activity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate configuration
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY as GitHub Actions repository secrets."
            exit 1
          fi

      - name: Send a read-only request to Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL%/}/rest/v1/tenants?select=id&limit=1"
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          set +e
          HTTP_CODE="$(curl --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 20 \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "$URL" \
            --header "apikey: $SUPABASE_ANON_KEY")"
          CURL_EXIT=$?
          set -e

          echo "Supabase responded with HTTP ${HTTP_CODE:-000}"

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::The request could not be completed. curl exit code: $CURL_EXIT"
            exit "$CURL_EXIT"
          fi

          case "$HTTP_CODE" in
            2*)
              echo "Supabase keep-alive request completed successfully."
              ;;
            *)
              echo "::error::Supabase rejected the request. Response details:"
              cat "$RESPONSE_FILE"
              exit 1
              ;;
          esac
